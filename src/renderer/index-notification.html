<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moli Notification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }
    
    .notification-root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10px;
    }
    
    /* 胶囊样式 */
    .capsule {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px 8px 8px;
      min-width: 280px;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      animation: islandPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    
    .capsule:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.15);
    }
    
    @keyframes islandPop {
      from {
        opacity: 0;
        transform: translateY(-20px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .capsule-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    
    .capsule-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .capsule-avatar span {
      color: white;
      font-size: 14px;
      font-weight: 600;
    }
    
    .capsule-content {
      flex: 1;
      min-width: 0;
    }
    
    .capsule-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    
    .capsule-message {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
  </style>
</head>
<body>
  <div class="notification-root" id="app"></div>
  <script>
    // 接收主进程消息并渲染
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('notification:show', (event, data) => {
      const app = document.getElementById('app');
      const { characterName, content } = data;
      
      app.innerHTML = `
        <div class="capsule" onclick="window.close()">
          <div class="capsule-avatar">
            <span>${characterName.charAt(0)}</span>
          </div>
          <div class="capsule-content">
            <div class="capsule-name">${characterName}</div>
            <div class="capsule-message">${content}</div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
